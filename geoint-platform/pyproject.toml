[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "geoint-platform"
version = "2.7.1"
description = "Modular geospatial intelligence ingestion and tracking platform"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",

    "httpx>=0.27,<1",
    "tenacity>=9,<10",

    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<1",
    "geoalchemy2>=0.15,<1",
    "alembic>=1.14,<2",

    "redis>=5,<6",

    "nats-py>=2.9,<3",

    "minio>=7.2,<8",

    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "pyproj>=3.7,<4",
    "shapely>=2.0,<3",
    "rasterio>=1.4,<2",
    "pillow>=10,<12",
    "sgp4>=2.24,<3",

    "prometheus-client>=0.21,<1",
    "opentelemetry-api>=1.28,<2",
    "opentelemetry-sdk>=1.28,<2",
    "opentelemetry-exporter-otlp>=1.28,<2",
    "opentelemetry-instrumentation-fastapi>=0.49b0",

    "structlog>=24.4,<25",
    "pyjwt>=2.10,<3",

    "pystac-client>=0.8,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<7",
    "respx>=0.21,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is the documented pattern
    "E402",  # intentional late imports (pytest.importorskip, optional deps)
    "B007",  # unused loop vars sometimes intentional
    "UP038",  # isinstance(x, (A, B)) remains clearer than A | B for many readers
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "F401"]
"scripts/**/*.py" = ["E402", "F401"]
"app/workers/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = false

