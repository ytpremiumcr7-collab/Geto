services:

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: geoint
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: geoint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoint -d geoint"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command:
      - "-js"
      - "-m"
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  object-store:
    image: chrislusf/seaweedfs:4.47
    command: ["mini", "-dir=/data", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: change-me-s3
      AWS_SECRET_ACCESS_KEY: change-me-s3-password
      S3_BUCKET: geoint-raw
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9009:9009"
    volumes:
      - clickhousedata:/var/lib/clickhouse

  geoint-api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://geoint:change-me@postgres:5432/geoint
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: object-store:8333
      S3_ACCESS_KEY: change-me-s3
      S3_SECRET_KEY: change-me-s3-password
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      object-store:
        condition: service_healthy

  geoint-scheduler:
    build: .
    command: ["python", "-m", "app.workers.job_scheduler"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://geoint:change-me@postgres:5432/geoint
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: object-store:8333
      S3_ACCESS_KEY: change-me-s3
      S3_SECRET_KEY: change-me-s3-password
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  geoint-worker:
    build: .
    command: ["python", "-m", "app.workers.source_worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://geoint:change-me@postgres:5432/geoint
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: object-store:8333
      S3_ACCESS_KEY: change-me-s3
      S3_SECRET_KEY: change-me-s3-password
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      object-store:
        condition: service_healthy
    restart: unless-stopped

  geoint-outbox:
    build: .
    command: ["python", "-m", "app.outbox.dispatcher"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://geoint:change-me@postgres:5432/geoint
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped


volumes:
  pgdata:
  natsdata:
  s3data:
  clickhousedata:

