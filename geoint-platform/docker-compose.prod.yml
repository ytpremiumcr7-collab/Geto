# GEOINT production / staging stack
# Secrets MUST be injected via environment or --env-file pointing to a secret-manager materialization.
# Never commit .env.prod. Never use change-me / minioadmin defaults here.
#
# Required host env (or env-file):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   MINIO_ROOT_USER, MINIO_ROOT_PASSWORD
#   GEOINT_ENV_FILE  (path to API env with JWT_JWKS_URL, CORS_ORIGINS, DATABASE_URL, …)
#
# Bootstrap:
#   ./scripts/deploy.sh up

name: geoint-prod

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-geoint}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-geoint}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [geoint]
    # Do not publish DB ports in production by default

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [geoint]

  nats:
    image: nats:2.10-alpine
    command: ["--js", "--sd", "/data", "--http_port", "8222"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [geoint]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [geoint]

  geoint-api:
    build: .
    env_file: ${GEOINT_ENV_FILE:?GEOINT_ENV_FILE is required (e.g. /run/secrets/geoint.env)}
    environment:
      APP_ENV: ${APP_ENV:-production}
      AUTH_DISABLED: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geoint}
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${GEOINT_API_PORT:-8000}:8000"
    restart: unless-stopped
    networks: [geoint]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  geoint-scheduler:
    build: .
    command: ["python", "-m", "app.workers.job_scheduler"]
    env_file: ${GEOINT_ENV_FILE}
    environment:
      APP_ENV: ${APP_ENV:-production}
      AUTH_DISABLED: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geoint}
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      geoint-api:
        condition: service_healthy
    restart: unless-stopped
    networks: [geoint]

  geoint-worker:
    build: .
    command: ["python", "-m", "app.workers.source_worker"]
    env_file: ${GEOINT_ENV_FILE}
    environment:
      APP_ENV: ${APP_ENV:-production}
      AUTH_DISABLED: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geoint}
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      geoint-api:
        condition: service_healthy
    restart: unless-stopped
    networks: [geoint]
    deploy:
      replicas: 2

  geoint-outbox:
    build: .
    command: ["python", "-m", "app.outbox.dispatcher"]
    env_file: ${GEOINT_ENV_FILE}
    environment:
      APP_ENV: ${APP_ENV:-production}
      AUTH_DISABLED: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geoint}
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    networks: [geoint]

volumes:
  pgdata:
  redisdata:
  natsdata:
  miniodata:

networks:
  geoint:
    driver: bridge
