name: Security gates

on:
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend-security-hard:
    name: Backend security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: geoint-platform/requirements.lock.txt
      - name: Install locked dependencies
        working-directory: geoint-platform
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock.txt
      - name: Dependency audit
        working-directory: geoint-platform
        run: pip-audit -r requirements.lock.txt --disable-pip
      - name: Bandit SAST
        working-directory: geoint-platform
        run: bandit -r app/ -ll -ii

  frontend-security-hard:
    name: Frontend security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: geoint-web/package-lock.json
      - name: Install locked dependencies
        working-directory: geoint-web
        run: npm ci
      - name: Dependency audit
        working-directory: geoint-web
        run: npm audit --audit-level=moderate
