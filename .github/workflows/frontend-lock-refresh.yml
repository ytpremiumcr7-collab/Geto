name: Frontend lock refresh

on:
  pull_request:
    branches: [main]
    paths:
      - "geoint-web/package.json"
      - ".github/workflows/frontend-lock-refresh.yml"

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  refresh-lock:
    name: Generate npm package lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/geto-production-readiness-20260919

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate lockfile
        working-directory: geoint-web
        run: npm install --package-lock-only --ignore-scripts

      - name: Audit generated lock
        working-directory: geoint-web
        run: npm audit --audit-level=moderate

      - name: Commit generated lock
        run: |
          if git diff --quiet -- geoint-web/package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geoint-web/package-lock.json
          git commit -m "chore: refresh frontend package lock"
          git push origin HEAD:fix/geto-production-readiness-20260919
