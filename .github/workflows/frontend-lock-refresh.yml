name: Frontend lock refresh

on:
  pull_request:
    branches: [main]
    paths:
      - "geoint-web/package.json"
      - ".github/workflows/frontend-lock-refresh.yml"

env:
  NODE_VERSION: "22"

jobs:
  refresh-lock:
    name: Generate npm package lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate lockfile
        working-directory: geoint-web
        run: npm install --package-lock-only --ignore-scripts

      - name: Audit generated lock
        working-directory: geoint-web
        run: npm audit --audit-level=moderate

      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: geoint-web/package-lock.json
          retention-days: 1
