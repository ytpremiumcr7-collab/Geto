name: Ingestion pipeline E2E

on:
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  DATABASE_URL: postgresql+asyncpg://geoint:geoint_ci_ingestion@localhost:5432/geoint
  NATS_URL: nats://localhost:4222
  MINIO_ENDPOINT: localhost:9000
  MINIO_ACCESS_KEY: ciaccesskey12
  MINIO_SECRET_KEY: cisecretkey123456
  MINIO_SECURE: "false"
  MINIO_CREATE_BUCKET: "true"
  APP_ENV: test
  AUTH_DISABLED: "true"
  JWT_SECRET: ci-ingestion-jwt-secret-32bytes-minimum
  CLICKHOUSE_ENABLED: "false"
  GEOINT_SYSTEM_WORKER: "1"

jobs:
  ingestion-e2e:
    name: Scheduler -> NATS -> worker -> ingestion
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geoint
          POSTGRES_PASSWORD: geoint_ci_ingestion
          POSTGRES_DB: geoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geoint -d geoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: geoint-platform/requirements.lock.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev gdal-bin

      - name: Install locked Python dependencies
        working-directory: geoint-platform
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock.txt
          pip install --no-deps -e .

      - name: Start NATS JetStream and MinIO
        run: |
          docker run -d --name geoint-nats-ci -p 4222:4222 -p 8222:8222 nats:2.10-alpine -js -m 8222

          MINIO_RELEASE="RELEASE.2025-04-22T22-12-26Z"
          MINIO_BIN="minio.linux-amd64.${MINIO_RELEASE}"
          MINIO_URL="https://github.com/minio/minio/releases/download/${MINIO_RELEASE}/${MINIO_BIN}"
          curl -fL --retry 3 --retry-delay 2 -o /tmp/minio "${MINIO_URL}"
          echo "53e2a2cb16c5366ea6fbbc479c19ddb4c6a0948273e752f740fb1fbf27bb817c  /tmp/minio" | sha256sum -c -
          chmod +x /tmp/minio
          mkdir -p /tmp/geoint-minio-data
          MINIO_ROOT_USER=ciaccesskey12 \
          MINIO_ROOT_PASSWORD=cisecretkey123456 \
            /tmp/minio server /tmp/geoint-minio-data --address ":9000" --console-address ":9001" \
            >/tmp/geoint-minio.log 2>&1 &
          echo $! >/tmp/geoint-minio.pid

          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8222/healthz >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8222/healthz >/dev/null
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null

      - name: Apply migrations
        working-directory: geoint-platform
        run: alembic upgrade head

      - name: Run real ingestion pipeline
        working-directory: geoint-platform
        run: python scripts/e2e_ingestion_pipeline.py

      - name: Service logs on failure
        if: failure()
        run: |
          docker logs geoint-nats-ci || true
          cat /tmp/geoint-minio.log || true

      - name: Stop NATS and MinIO
        if: always()
        run: |
          docker rm -f geoint-nats-ci || true
          if [ -f /tmp/geoint-minio.pid ]; then
            kill "$(cat /tmp/geoint-minio.pid)" || true
          fi
