name: Ingestion pipeline E2E

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DATABASE_URL: postgresql+asyncpg://geoint:geoint_ci_ingestion@localhost:5432/geoint
  NATS_URL: nats://localhost:4222
  S3_ENDPOINT: localhost:8333
  S3_ACCESS_KEY: ciaccesskey12
  S3_SECRET_KEY: cisecretkey123456
  S3_BUCKET_RAW: geoint-raw
  S3_SECURE: "false"
  S3_CREATE_BUCKET: "false"
  APP_ENV: test
  AUTH_DISABLED: "true"
  JWT_SECRET: ci-ingestion-jwt-secret-32bytes-minimum
  CLICKHOUSE_ENABLED: "false"
  GEOINT_SYSTEM_WORKER: "1"

jobs:
  ingestion-e2e:
    name: Scheduler -> NATS -> worker -> ingestion
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geoint
          POSTGRES_PASSWORD: geoint_ci_ingestion
          POSTGRES_DB: geoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geoint -d geoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: geoint-platform/requirements.lock.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev gdal-bin

      - name: Install locked Python dependencies
        working-directory: geoint-platform
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock.txt
          pip install --no-deps -e .

      - name: Start NATS JetStream and S3 object storage
        run: |
          docker run -d --name geoint-nats-ci -p 4222:4222 -p 8222:8222 nats:2.10-alpine -js -m 8222
          docker run -d --name geoint-s3-ci -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID=ciaccesskey12 \
            -e AWS_SECRET_ACCESS_KEY=cisecretkey123456 \
            -e S3_BUCKET=geoint-raw \
            chrislusf/seaweedfs:4.47 \
            mini -dir=/data -ip.bind=0.0.0.0

          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8222/healthz >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8222/healthz >/dev/null

          for i in {1..45}; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/ || true)"
            [ "$code" != "000" ] && break
            sleep 1
          done
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/ || true)"
          [ "$code" != "000" ]

      - name: Apply migrations
        working-directory: geoint-platform
        run: alembic upgrade head

      - name: Run real ingestion pipeline with critical coverage gate
        working-directory: geoint-platform
        run: |
          coverage erase
          coverage run --source=app scripts/e2e_ingestion_pipeline.py
          coverage report --show-missing \
            --include="app/workers/source_worker.py,app/workers/job_scheduler.py,app/jobs/repository.py,app/ingestion/dispatcher.py" \
            --fail-under=60

      - name: Service logs on failure
        if: failure()
        run: |
          docker logs geoint-nats-ci || true
          docker logs geoint-s3-ci || true

      - name: Stop NATS and S3 object storage
        if: always()
        run: |
          docker rm -f geoint-nats-ci || true
          docker rm -f geoint-s3-ci || true
