name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ==================== BACKEND ====================
  backend-lint:
    name: Backend - Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        working-directory: ./geoint-platform
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff check
        working-directory: ./geoint-platform
        run: ruff check .

      - name: Ruff format check
        working-directory: ./geoint-platform
        run: ruff format --check .

      - name: MyPy type check
        working-directory: ./geoint-platform
        run: |
          pip install -e ".[dev]"
          mypy app/ --ignore-missing-imports --no-strict-optional || true

  backend-test:
    name: Backend - Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install Python dependencies
        working-directory: ./geoint-platform
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -e ".[dev]"

      - name: Create .env for tests
        working-directory: ./geoint-platform
        run: |
          cp .env.example .env
          echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> .env
          echo "AUTH_DISABLED=false" >> .env

      - name: Run unit tests with coverage
        working-directory: ./geoint-platform
        run: |
          pytest tests/unit/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=test-results.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./geoint-platform/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: ./geoint-platform/test-results.xml

  backend-security:
    name: Backend - Security Scan
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Bandit security linter
        working-directory: ./geoint-platform
        run: |
          pip install bandit
          bandit -r app/ -f json -o bandit-report.json || true

      - name: Run Safety check
        working-directory: ./geoint-platform
        run: |
          pip install safety
          safety check -r requirements.lock.txt --json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            ./geoint-platform/bandit-report.json

  # ==================== FRONTEND ====================
  frontend-check:
    name: Frontend - Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ./geoint-web/package-lock.json

      - name: Install dependencies
        working-directory: ./geoint-web
        run: npm ci

      - name: TypeScript check
        working-directory: ./geoint-web
        run: npx tsc -b --noEmit

      - name: Build
        working-directory: ./geoint-web
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./geoint-web/dist
          retention-days: 7

  frontend-security:
    name: Frontend - Security Audit
    runs-on: ubuntu-latest
    needs: frontend-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ./geoint-web/package-lock.json

      - name: Install dependencies
        working-directory: ./geoint-web
        run: npm ci

      - name: NPM Audit
        working-directory: ./geoint-web
        run: npm audit --audit-level=high || true

  # ==================== DOCKER ====================
  docker-build:
    name: Docker - Build Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        working-directory: ./geoint-platform
        run: |
          docker build -t geoint-platform:ci-${{ github.sha }} .
          docker image inspect geoint-platform:ci-${{ github.sha }} > /dev/null

      - name: Build frontend image (if Dockerfile exists)
        working-directory: ./geoint-web
        run: |
          if [ -f Dockerfile ]; then
            docker build -t geoint-web:ci-${{ github.sha }} .
            docker image inspect geoint-web:ci-${{ github.sha }} > /dev/null
          else
            echo "No Dockerfile in frontend, skipping"
          fi

  # ==================== DEPLOY (opcional) ====================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend-security, frontend-security, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          # Aquí agregarías tu lógica de deploy:
          # - SSH a servidor
          # - Docker compose pull && up
          # - kubectl apply
          # - etc.

      - name: Deployment notification
        run: |
          echo "✅ Deployment completed successfully!"

  # ==================== SUMMARY ====================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-security, frontend-security]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "## 📊 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Lint | ${{ needs.backend-security.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend-security.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Security | ${{ needs.backend-security.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build | ${{ needs.frontend-security.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Security | ${{ needs.frontend-security.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
