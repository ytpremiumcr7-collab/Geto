name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ==================== BACKEND ====================
  backend-lint:
    name: Backend - Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: geoint-platform/pyproject.toml

      - name: Install lint tools
        working-directory: ./geoint-platform
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.8,<1" "mypy>=1.13,<2"

      - name: Ruff check
        working-directory: ./geoint-platform
        run: ruff check .

      - name: Ruff format check
        working-directory: ./geoint-platform
        run: ruff format --check .

      - name: MyPy type check
        working-directory: ./geoint-platform
        run: |
          pip install -e ".[dev]"
          mypy app/ --ignore-missing-imports --no-strict-optional

  backend-test:
    name: Backend - Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            geoint-platform/requirements.lock.txt
            geoint-platform/pyproject.toml

      - name: Install system deps (GDAL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev gdal-bin

      - name: Install Python dependencies
        working-directory: ./geoint-platform
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -e ".[dev]"

      - name: Create .env for tests
        working-directory: ./geoint-platform
        run: |
          cp .env.example .env
          echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> .env
          echo "AUTH_DISABLED=false" >> .env

      - name: Run unit tests with coverage
        working-directory: ./geoint-platform
        run: |
          pytest tests/unit/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=test-results.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          file: ./geoint-platform/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  backend-security:
    name: Backend - Security Scan
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: pip-audit
        working-directory: ./geoint-platform
        run: |
          pip install -r requirements.lock.txt
          pip-audit -r requirements.lock.txt || true  # advisory until --require-hashes lock
        continue-on-error: true

      - name: Bandit SAST
        working-directory: ./geoint-platform
        run: bandit -r app/ -ll -ii
        continue-on-error: true

  # ==================== FRONTEND ====================
  frontend-build:
    name: Frontend - Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: geoint-web/package-lock.json

      - name: Install dependencies
        working-directory: ./geoint-web
        run: npm ci

      - name: Type check
        working-directory: ./geoint-web
        run: npm run typecheck

      - name: Build
        working-directory: ./geoint-web
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: geoint-web/dist
          retention-days: 7

  frontend-security:
    name: Frontend - Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: geoint-web/package-lock.json

      - name: npm audit
        working-directory: ./geoint-web
        run: npm audit --audit-level=high || true  # advisory; does not block until lockfile policy
        continue-on-error: true

  # ==================== DOCKER ====================
  docker-build:
    name: Docker - Build Images
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, e2e-smoke, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        working-directory: ./geoint-platform
        run: |
          docker build -t geoint-platform:ci-${{ github.sha }} .
          docker image inspect geoint-platform:ci-${{ github.sha }} > /dev/null

      - name: Build frontend image (if Dockerfile exists)
        working-directory: ./geoint-web
        run: |
          if [ -f Dockerfile ]; then
            docker build -t geoint-web:ci-${{ github.sha }} .
            docker image inspect geoint-web:ci-${{ github.sha }} > /dev/null
          else
            echo "No Dockerfile in frontend, skipping"
          fi


  # ==================== E2E SMOKE (Postgres live) ====================
  e2e-smoke:
    name: Backend - E2E Smoke (Postgres)
    runs-on: ubuntu-latest
    needs: [backend-lint]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geoint
          POSTGRES_PASSWORD: geoint_ci_smoke
          POSTGRES_DB: geoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geoint -d geoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://geoint:geoint_ci_smoke@localhost:5432/geoint
      REDIS_URL: redis://localhost:6379/0
      NATS_URL: nats://localhost:4222
      MINIO_ACCESS_KEY: ciaccesskey12
      MINIO_SECRET_KEY: cisecretkey123456
      MINIO_ENDPOINT: localhost:9000
      APP_ENV: development
      AUTH_DISABLED: "true"
      JWT_SECRET: "ci-smoke-jwt-secret-32bytes-min!!"
      CLICKHOUSE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: geoint-platform/requirements.lock.txt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev gdal-bin

      - name: Install Python deps
        working-directory: ./geoint-platform
        run: |
          python -m pip install -U pip
          pip install -r requirements.lock.txt
          pip install -e ".[dev]"

      - name: Alembic upgrade head
        working-directory: ./geoint-platform
        run: alembic upgrade head

      - name: Offline alert notifier verify
        working-directory: ./geoint-platform
        run: python scripts/verify_alert_notifier_flow.py

      - name: Product E2E (me → alert → delivery)
        working-directory: ./geoint-platform
        run: python scripts/e2e_ci_product_flow.py

      - name: API smoke (lifespan + health)
        working-directory: ./geoint-platform
        run: |
          python - <<'PY'
          import os, asyncio
          os.environ.setdefault("APP_ENV", "development")
          os.environ.setdefault("AUTH_DISABLED", "true")
          from httpx import ASGITransport, AsyncClient
          from app.main import app

          async def main():
              transport = ASGITransport(app=app)
              async with AsyncClient(transport=transport, base_url="http://test") as client:
                  r = await client.get("/health/live")
                  assert r.status_code == 200, r.text
                  r = await client.get("/health/version")
                  assert r.status_code == 200, r.text
                  r = await client.get("/api/v1/me")
                  assert r.status_code == 200, r.text
                  body = r.json()
                  assert "permissions" in body and "roles" in body
                  r = await client.get("/api/v1/analytics/templates")
                  assert r.status_code == 200, r.text
                  r = await client.get("/api/v1/topography/providers")
                  assert r.status_code == 200, r.text
                  print("SMOKE_OK", body.get("roles"), "perms", len(body.get("permissions") or []))

          asyncio.run(main())
          PY


  # ==================== DEPLOY (real when secrets present) ====================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend-security, frontend-security, docker-build, backend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        id: gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets not configured (DEPLOY_HOST/USER/SSH_KEY)."
            echo "Skipping real deploy — not reporting false success."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install SSH key
        if: steps.gate.outputs.configured == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Remote deploy (git pull + deploy.sh up)
        if: steps.gate.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          export DEPLOY_SSH_KEY="$HOME/.ssh/deploy_key"
          export DEPLOY_PATH="${DEPLOY_PATH:-/opt/geoint}"
          chmod +x geoint-platform/scripts/deploy.sh
          geoint-platform/scripts/deploy.sh remote-up

      - name: Deployment summary
        run: |
          if [ "${{ steps.gate.outputs.configured }}" = "true" ]; then
            echo "Staging deploy finished for ${{ github.sha }}"
          else
            echo "Staging deploy skipped (configure GitHub Environment secrets to enable)."
          fi

  # ==================== SUMMARY ====================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-test
      - backend-security
      - frontend-build
      - frontend-security
      - docker-build
      - e2e-smoke
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Lint | ${{ needs.backend-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Security | ${{ needs.backend-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build | ${{ needs.frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Security | ${{ needs.frontend-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.backend-lint.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "Critical jobs failed"
            exit 1
          fi
